name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Immutable releases cannot receive new assets."
            echo "Use a new version tag, or delete the existing release and tag before retrying."
            exit 1
          fi

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zotero Puls ${GITHUB_REF_NAME}" \
            --generate-notes \
            .scaffold/build/zotero-puls.xpi \
            .scaffold/build/update.json \
            .scaffold/build/update-beta.json
